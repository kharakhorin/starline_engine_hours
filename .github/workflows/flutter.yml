name: Build and release

on:
  workflow_dispatch:
  push:
    paths:
      - 'pubspec.yaml'

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      new_version: v${{ steps.get_new_version.outputs.result }}
      version_change_status: ${{ steps.version_change_status.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get new version
        id: get_new_version
        uses: mikefarah/yq@v4
        with:
          # Отрезаем билд-номер («2.0.0+8» → «2.0.0»), чтобы тег
          # релиза оставался чистым vX.Y.Z.
          cmd: yq '.version | split("+") | .[0]' 'pubspec.yaml'
      - name: Get current version
        id: get_current_version
        run: echo "version=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
      - name: Check version change
        id: version_change_status
        run: |
          if [ "v${{ steps.get_new_version.outputs.result }}" = "${{ steps.get_current_version.outputs.version }}" ]; then
            echo "result=not_changed" >> "$GITHUB_OUTPUT"
          else
            echo "result=changed" >> "$GITHUB_OUTPUT"
          fi

  build_and_release:
    runs-on: ubuntu-latest
    needs: check_version
    # Собираем всегда при ручном запуске (для проверки сборки),
    # релиз создаётся только если версия изменилась.
    if: needs.check_version.outputs.version_change_status == 'changed' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: starline_engine_hours_apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Create Release
        if: needs.check_version.outputs.version_change_status == 'changed'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Суффикс «#имя» у gh release create меняет только подпись ассета,
          # а не имя файла. Даём файлу нормальное имя до загрузки.
          cp build/app/outputs/flutter-apk/app-release.apk starline_engine_hours.apk
          gh release create "${{ needs.check_version.outputs.new_version }}" \
            --title "${{ needs.check_version.outputs.new_version }}" \
            starline_engine_hours.apk
