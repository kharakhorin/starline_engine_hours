name: starline_engine_hours
description: Вычисление моточасов с помощью API StarLine Телематика
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.7

environment:
  sdk: ">=3.5.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  collection: ^1.18.0
  faker: ^2.2.0
  shared_preferences: ^2.3.2
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  auto_size_text: ^3.0.0
  intl: ^0.20.3
  flutter_native_splash: ^2.4.8
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/car-engine.png"

flutter_native_splash:
  image: assets/car-engine.png
  color: "42a5f5"
  # Картинка сплэша — на чёрном фоне, в тёмной теме под него и подгоняем.
  color_dark: "000000"

flutter:
  uses-material-design: true
  assets:
    - assets/car-engine.png
